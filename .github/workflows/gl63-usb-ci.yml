name: MSI GL63-Inspired USB + Ethernet NIC CI

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "src/boot/**"
      - "src/include/**"
      - "src/kernel/**"
      - ".github/workflows/gl63-usb-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Makefile"
      - "src/boot/**"
      - "src/include/**"
      - "src/kernel/**"
      - ".github/workflows/gl63-usb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q35-xhci-compatibility:
    name: Q35 UEFI + xHCI + Ethernet NIC detection
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out VexOS
        uses: actions/checkout@v4

      - name: Install build and emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gcc gnu-efi mtools qemu-system-x86 ovmf fonts-inter fonts-lato fonts-dejavu-core fonts-noto-core

      - name: Build CI-instrumented VexOS
        run: |
          make clean
          make VEXOS_CI=1 -j2 all
          test -s dist/BOOTX64.EFI
          test -s dist/kernel.elf
          test -s dist/tiny64.img
          test -s dist/storage.img

      - name: Prepare SFS1 ATA fixture and disposable USB mass-storage device
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import struct
          from pathlib import Path

          # Match the kernel's packed SFS1 layout and the 700-byte CI payload.
          image = Path("dist/storage.img")
          payload = bytes((i * 37 + 11) & 0xFF for i in range(700))
          superblock = struct.pack("<8I", 0x31465353, 1, 1, 8, 9, 11, 1, 0)
          table = bytearray(8 * 512)
          entry = struct.pack(
              "<B32sIII", 1, b"ci.txt".ljust(32, bytes([0])), 9, len(payload), 0
          )
          table[:len(entry)] = entry

          with image.open("r+b") as disk:
              disk.seek(0)
              disk.write(superblock)
              disk.write(bytes(512 - len(superblock)))
              disk.seek(512)
              disk.write(table)
              disk.seek(9 * 512)
              disk.write(payload.ljust(1024, bytes([0])))

          # Read back the key fixture fields before launching the guest.
          with image.open("rb") as disk:
              assert struct.unpack("<8I", disk.read(32)) == (
                  0x31465353, 1, 1, 8, 9, 11, 1, 0
              )
              disk.seek(9 * 512)
              assert disk.read(700) == payload
          PY
          truncate -s 16M dist/usb-test.img
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS_GL63.fd

      - name: Boot Q35 laptop-style machine with xHCI and USB devices
        shell: bash
        run: |
          set -Eeuo pipefail
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          test -s "$OVMF_CODE"
          : > serial.log
          : > qemu.log

          # Q35 provides a PCIe-oriented Intel-style chipset topology.
          # QEMU e1000e supplies an emulated Intel 82574L PCIe Ethernet NIC.
          # This currently tests PCI discovery only: VexOS has no Ethernet
          # driver or network stack yet, so no packets/DHCP/ping are claimed.
          # QEMU's qemu-xhci is a generic emulated xHCI controller, not the
          # exact Intel HM370 controller found in some MSI GL63 variants.
          # Q35 uses the PCIe root bus (pcie.0), not the i440fx pci.0 bus.
          # Attach this legacy PCI IDE controller as a root-complex endpoint;
          # it exists only to provide the primary-slave ATA PIO SFS1 fixture.
          qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -m 2G \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,unit=1,file=/tmp/OVMF_VARS_GL63.fd \
            -device ich9-ahci,id=sata \
            -drive if=none,id=bootdisk,format=raw,file=dist/tiny64.img \
            -device ide-hd,drive=bootdisk,bus=sata.0 \
            -device piix3-ide,id=legacyide,bus=pcie.0 \
            -drive if=none,id=sfs1_disk,format=raw,file=dist/storage.img \
            -device ide-hd,drive=sfs1_disk,bus=legacyide.0,unit=1 \
            -drive if=none,id=usb_disk,format=raw,file=dist/usb-test.img \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -device usb-tablet,bus=xhci.0 \
            -device usb-storage,drive=usb_disk,bus=xhci.0 \
            -netdev user,id=net0 \
            -device e1000e,netdev=net0,bus=pcie.0,addr=0x5 \
            -display none \
            -monitor none \
            -serial file:serial.log \
            -no-reboot -no-shutdown >qemu.log 2>&1 &
          qemu_pid=$!

          cleanup() {
            status=$?
            if kill -0 "$qemu_pid" 2>/dev/null; then
              kill "$qemu_pid" 2>/dev/null || true
            fi
            wait "$qemu_pid" 2>/dev/null || true
            cp serial.log artifacts/serial.log
            cp qemu.log artifacts/qemu.log
            exit "$status"
          }
          trap cleanup EXIT

          # First require the controller to start, then wait for the guest's
          # synchronous root-port enumeration pass to finish.
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            if grep -Fq "[xHCI] Controller Running" serial.log; then
              break
            fi
            if grep -Fq "[KERNEL] FATAL:" serial.log; then
              echo "VexOS reported a fatal kernel error:"
              cat serial.log
              exit 1
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before xHCI reached the running state."
              cat qemu.log
              cat serial.log
              exit 1
            fi
            sleep 0.25
          done

          if ! grep -Fq "[xHCI] Controller Running" serial.log; then
            echo "Timed out waiting for xHCI controller initialization."
            cat qemu.log
            cat serial.log
            exit 1
          fi

          enumeration_deadline=$((SECONDS + 90))
          while (( SECONDS < enumeration_deadline )); do
            if grep -Fq "[xHCI][SUMMARY]" serial.log; then
              break
            fi
            if grep -Fq "[KERNEL] FATAL:" serial.log; then
              echo "Kernel fatal error during USB enumeration:"
              cat serial.log
              exit 1
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before USB enumeration completed."
              cat qemu.log
              cat serial.log
              exit 1
            fi
            sleep 0.25
          done

          if ! grep -Fq "[xHCI][SUMMARY]" serial.log; then
            echo "Timed out waiting for the xHCI root-port enumeration summary."
            cat qemu.log
            cat serial.log
            exit 1
          fi

          if grep -Fq "[KERNEL] FATAL:" serial.log; then
            echo "Kernel fatal error detected during xHCI enumeration."
            cat serial.log
            exit 1
          fi

          # QEMU attaches a USB keyboard, tablet (HID mouse), and mass-storage
          # device. Require all three to be connected, addressed, and described.
          # The current kernel does not implement a USB mass-storage class
          # driver, so this test deliberately stops at descriptor/config setup.
          count_matches() {
            local pattern="$1"
            grep -cF "$pattern" serial.log || true
          }

          connected_count="$(grep -oE 'connected=[0-9]+' serial.log | tail -n1 | cut -d= -f2)"
          addressed_count="$(grep -oE 'addressed=[0-9]+' serial.log | tail -n1 | cut -d= -f2)"
          descriptor_count="$(count_matches '[USB] Device Descriptor VID:PID=')"
          config_count="$(count_matches '[USB] Config total_len=')"
          set_config_count="$(count_matches '[USB] SET_CONFIGURATION done')"
          hid_armed_count="$(count_matches '[HID] Interrupt IN armed')"

          echo "USB enumeration results:"
          echo "  connected ports:       ${connected_count:-0}"
          echo "  addressed devices:     ${addressed_count:-0}"
          echo "  device descriptors:    ${descriptor_count}"
          echo "  configuration reads:   ${config_count}"
          echo "  configurations set:    ${set_config_count}"
          echo "  HID interrupt IN armed:${hid_armed_count}"

          failures=0
          require_minimum() {
            local label="$1"
            local actual="${2:-0}"
            local expected="$3"
            if (( actual < expected )); then
              echo "FAIL: expected at least ${expected} ${label}, got ${actual}."
              failures=$((failures + 1))
            fi
          }

          require_minimum "connected USB devices" "$connected_count" 3
          require_minimum "addressed USB devices" "$addressed_count" 3
          require_minimum "successful device descriptors" "$descriptor_count" 3
          require_minimum "successful configuration descriptor reads" "$config_count" 3
          require_minimum "SET_CONFIGURATION completions" "$set_config_count" 3
          require_minimum "HID interrupt-IN endpoints armed" "$hid_armed_count" 2

          if (( failures > 0 )); then
            echo "USB enumeration smoke test failed. Full serial log follows:"
            cat serial.log
            exit 1
          fi

          echo "PASS: VexOS detected, addressed, and read descriptors for the three emulated USB devices."
          echo "PASS: Both emulated HID devices reached interrupt-IN endpoint setup."
          echo "NOTE: USB mass-storage data transfers and live HID input are not tested by this CI job."
          echo "Checking emulated Ethernet NIC discovery..."
          # QEMU e1000e is Intel 8086:10D3 (PCIe class 02:00:00).
          if ! grep -Fq "10D38086" serial.log || ! grep -Fq "class=00000002" serial.log; then
            echo "FAIL: VexOS did not enumerate the emulated Intel e1000e PCIe Ethernet controller."
            cat serial.log
            exit 1
          fi
          echo "PASS: VexOS PCI enumeration detected the emulated Intel e1000e PCIe Ethernet controller (8086:10D3)."
          echo "NOTE: Ethernet link, packet TX/RX, ARP, DHCP, DNS, and ping are not tested; a network driver/stack is not implemented yet."
          grep -E "\\[PCI\\]|\\[xHCI\\]|\\[USB\\]|\\[HID\\]" serial.log || true

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl63-q35-usb-ci-${{ github.run_number }}-${{ github.run_id }}
          path: |
            artifacts/
            serial.log
            qemu.log
          if-no-files-found: warn
          retention-days: 14
