name: VexOS CI

on:
  push:
    branches: [main, fix/filesystem-return-checks]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and Doom submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gcc gnu-efi mtools qemu-system-x86 ovmf

      - name: Verify UEFI toolchain paths
        run: |
          test -f /usr/include/efi/efi.h
          test -f /usr/lib/crt0-efi-x86_64.o
          test -f /usr/lib/elf_x86_64_efi.lds
          command -v mformat
          command -v mcopy
          command -v qemu-system-x86_64

      - name: Clean build bootloader, kernel, and disk images
        run: |
          make clean
          make VEXOS_CI=1 -j2 all

      - name: Verify build artifacts
        run: |
          test -s dist/BOOTX64.EFI
          test -s dist/kernel.elf
          test -s dist/tiny64.img
          test -s dist/storage.img
          file dist/BOOTX64.EFI dist/kernel.elf dist/tiny64.img dist/storage.img
          readelf -h dist/kernel.elf

      - name: Boot desktop in QEMU and inject USB keyboard input
        shell: bash
        run: |
          set -e
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -s "$OVMF_CODE"
          test -s "$OVMF_VARS_TEMPLATE"
          cp "$OVMF_VARS_TEMPLATE" /tmp/OVMF_VARS.fd
          rm -f /tmp/vexos-qmp.sock serial.log qemu.log

          qemu-system-x86_64 \
            -machine q35 \
            -m 512M \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,unit=1,file=/tmp/OVMF_VARS.fd \
            -drive if=ide,index=0,format=raw,file=dist/tiny64.img \
            -drive if=ide,index=1,format=raw,file=dist/storage.img \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor none \
            -serial file:serial.log \
            -qmp unix:/tmp/vexos-qmp.sock,server=on,wait=off \
            -no-reboot -no-shutdown >qemu.log 2>&1 &
          qemu_pid=$!
          cleanup() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for VexOS desktop and main loop..."
          for i in $(seq 1 200); do
            if grep -Fq "[KERNEL] Starting main loop" serial.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before reaching the desktop."
              cat qemu.log || true
              cat serial.log || true
              exit 1
            fi
            sleep 0.1
          done

          for marker in \
            "[KERNEL] Entered kernel_main" \
            "[KERNEL] Heap Initialized Successfully." \
            "[PCI] Enumeration Complete" \
            "[xHCI] Controller Running" \
            "[CI] Setup wizard skipped for automated desktop test" \
            "[KERNEL] Desktop initialized" \
            "[KERNEL] Starting main loop"; do
            if ! grep -Fq "$marker" serial.log; then
              echo "Expected boot marker missing: $marker"
              cat serial.log || true
              cat qemu.log || true
              exit 1
            fi
          done

          echo "Injecting a key through QEMU's emulated USB keyboard..."
          python3 - <<'PY'
          import json
          import socket
          import time

          path = "/tmp/vexos-qmp.sock"
          deadline = time.time() + 15
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          while True:
              try:
                  sock.connect(path)
                  break
              except (FileNotFoundError, ConnectionRefusedError):
                  if time.time() >= deadline:
                      raise
                  time.sleep(0.1)

          stream = sock.makefile("r", encoding="utf-8")
          greeting = json.loads(stream.readline())
          if "QMP" not in greeting:
              raise RuntimeError(f"Unexpected QMP greeting: {greeting}")

          def command(payload):
              sock.sendall((json.dumps(payload) + "\r\n").encode())
              while True:
                  response = json.loads(stream.readline())
                  if "return" in response:
                      return response["return"]
                  if "error" in response:
                      raise RuntimeError(response["error"])

          command({"execute": "qmp_capabilities"})
          command({
              "execute": "send-key",
              "arguments": {
                  "keys": [{"type": "qcode", "data": "a"}],
                  "hold-time": 100
              }
          })
          stream.close()
          sock.close()
          print("QMP successfully injected USB keyboard key 'a'.")
          PY

          echo "Waiting for the character to reach desktop input..."
          for i in $(seq 1 100); do
            if grep -Fq "[CI] Keyboard character reached desktop input queue" serial.log; then
              break
            fi
            sleep 0.1
          done

          if ! grep -Fq "[CI] Keyboard character reached desktop input queue" serial.log; then
            echo "USB keyboard input did not reach desktop_tick."
            cat serial.log || true
            cat qemu.log || true
            exit 1
          fi

          if grep -Fq "[KERNEL] FATAL:" serial.log; then
            echo "Kernel reported a fatal error:"
            cat serial.log
            exit 1
          fi

          echo "PASS: UEFI boot, desktop initialization, main loop, and injected USB keyboard input."
          tail -c 5000 serial.log
