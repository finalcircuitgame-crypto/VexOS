name: VexOS CI

on:
  push:
    branches: [main, fix/filesystem-return-checks, refactor/desktop-framework]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sfs2-host-tests:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/sfs2-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test SFS2 host image tools
        run: python3 -m unittest discover -s tools -p 'test_sfs2_image.py' -v

      - name: Test Files and Notepad interactions
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Isrc/include -Isrc/kernel/desktop \
            src/kernel/desktop/apps/files/file_manager.c \
            src/kernel/desktop/apps/notepad/notepad.c \
            tools/test_files_ui.c -o /tmp/files-ui-tests
          /tmp/files-ui-tests

  build-and-boot:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/sfs2-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and Doom submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize test artifact directory
        run: |
          mkdir -p artifacts
          printf 'Test result: NOT STARTED\\n' > artifacts/test-result.txt

      - name: Install toolchain and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gcc gnu-efi mtools qemu-system-x86 ovmf xvfb ffmpeg xterm python3-pil fonts-inter fonts-lato fonts-dejavu-core
          # Prepare the ignored font asset explicitly; the Makefile only embeds it.
          python3 tools/prepare_font_atlas.py --font-dir /usr/share/fonts --output assets/fonts/
          test "$(wc -c < assets/fonts/font_atlas.bin)" -eq 32768

      - name: Test SFS2 host image formatter and migration
        run: |
          python3 -m unittest discover -s tools -p 'test_sfs2_image.py' -v

      - name: Verify UEFI toolchain paths
        run: |
          test -f /usr/include/efi/efi.h
          test -f /usr/lib/crt0-efi-x86_64.o
          test -f /usr/lib/elf_x86_64_efi.lds
          command -v mformat
          command -v mcopy
          command -v qemu-system-x86_64

      - name: Build normal and CI-instrumented bootloader, kernel, and disk images
        run: |
          # First compile the exact default configuration used outside CI.
          make clean
          make -j2 all
          test -s dist/BOOTX64.EFI
          test -s dist/kernel.elf
          test -s dist/tiny64.img
          test -s dist/storage.img

          # Then rebuild with CI-only wizard/input instrumentation for QEMU tests.
          make clean
          make VEXOS_CI=1 -j2 all

          # Build Doom and fetch its IWAD only after the final clean/rebuild above.
          # This keeps both inputs intact for the subsequent SimpleFS packaging step.
          # Compile the separate ring-3 DoomGeneric ELF (no WAD is bundled).
          make VEXOS_CI=1 doom
          test -s dist/doom.elf
          readelf -h dist/doom.elf | grep -q 'EXEC'

          # Fetch the official Freedoom Phase 1 release (not id Software's Doom data).
          # Pin both the version and the published archive hash for reproducible CI.
          FREEDOOM_VERSION=0.13.0
          FREEDOOM_ZIP="freedoom-${FREEDOOM_VERSION}.zip"
          FREEDOOM_URL="https://github.com/freedoom/freedoom/releases/download/v${FREEDOOM_VERSION}/${FREEDOOM_ZIP}"
          FREEDOOM_SHA256=3f9b264f3e3ce503b4fb7f6bdcb1f419d93c7b546f4df3e874dd878db9688f59
          mkdir -p dist/freedoom
          curl --fail --location --retry 3 "$FREEDOOM_URL" --output "dist/freedoom/$FREEDOOM_ZIP"
          echo "$FREEDOOM_SHA256  dist/freedoom/$FREEDOOM_ZIP" | sha256sum --check -
          unzip -q "dist/freedoom/$FREEDOOM_ZIP" -d dist/freedoom
          test -s "dist/freedoom/freedoom-${FREEDOOM_VERSION}/freedoom1.wad"
          test -s "dist/freedoom/freedoom-${FREEDOOM_VERSION}/COPYING.txt"
          test -s "dist/freedoom/freedoom-${FREEDOOM_VERSION}/CREDITS.txt"
          cp "dist/freedoom/freedoom-${FREEDOOM_VERSION}/freedoom1.wad" dist/freedoom/freedoom1.wad
          cp "dist/freedoom/freedoom-${FREEDOOM_VERSION}/COPYING.txt" dist/freedoom/FREEDOOM-COPYING.txt
          cp "dist/freedoom/freedoom-${FREEDOOM_VERSION}/CREDITS.txt" dist/freedoom/FREEDOOM-CREDITS.txt
          echo "Prepared official Freedoom Phase 1 v${FREEDOOM_VERSION} with its license and credits."


      - name: Verify build artifacts
        run: |
          test -s dist/BOOTX64.EFI
          test -s dist/kernel.elf
          test -s dist/tiny64.img
          test -s dist/storage.img
          file dist/BOOTX64.EFI dist/kernel.elf dist/tiny64.img dist/storage.img
          readelf -h dist/kernel.elf
          echo "Kernel test symbol addresses:"
          nm -n dist/kernel.elf | grep -E 'irq0_stub|irq0_handler|Task_Schedule|ci_runtime_task_[ab]|Task_CI_StartRuntimeTest' || true
          echo "IRQ0 stub disassembly:"
          objdump -d dist/kernel.elf | sed -n '/<irq0_stub>:/,/^$/p'
          echo "IRQ0 handler disassembly:"
          objdump -d dist/kernel.elf | sed -n '/<irq0_handler>:/,/^$/p'
          echo "Task scheduler disassembly:"
          objdump -d dist/kernel.elf | sed -n '/<Task_Schedule>:/,/^$/p'

      - name: Boot desktop in QEMU and inject USB keyboard input
        shell: bash
        run: |
          set -e
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -s "$OVMF_CODE"
          test -s "$OVMF_VARS_TEMPLATE"

          # Prepare a minimal SFS1 disk with one known file for ATA/SimpleFS tests.
          python3 - <<'PY'
          import struct

          image = "dist/storage.img"
          payload = bytes((i * 37 + 11) & 0xFF for i in range(700))
          superblock = struct.pack(
              "<8I", 0x31465353, 1, 1, 8, 9, 11, 1, 0
          )
          table = bytearray(8 * 512)
          entry = struct.pack(
              "<B32sIII", 1, b"ci.txt".ljust(32, b"\0"), 9, len(payload), 0
          )
          table[:len(entry)] = entry
          with open(image, "r+b") as disk:
              disk.seek(0)
              disk.write(superblock)
              disk.write(bytes(512 - len(superblock)))
              disk.seek(512)
              disk.write(table)
              disk.seek(9 * 512)
              disk.write(payload.ljust(1024, b"\0"))
          PY

          # Add the real DoomGeneric executable and official Freedoom IWAD to SimpleFS.
          python3 tools/pack_doom_storage.py \
            --image dist/storage.img \
            --elf dist/doom.elf \
            --wad dist/freedoom/freedoom1.wad

          # Dedicated disposable SATA disk for the AHCI DMA self-test.
          dd if=/dev/zero of=dist/ahci-test.img bs=1M count=16 status=none

          cp "$OVMF_VARS_TEMPLATE" /tmp/OVMF_VARS.fd
          mkdir -p artifacts
          rm -f artifacts/*.png /tmp/vexos-qmp.sock serial.log qemu.log

          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1920x800x24 -nolisten tcp >xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 0.5
          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            echo "Recording/display setup FAILED: Xvfb did not start." | tee artifacts/test-result.txt
            cat xvfb.log || true
            exit 1
          fi

          touch serial.log
          # Put the serial console beside the 1280x800 guest display so kernel
          # initialization and boot diagnostics are visible in the MP4 itself.
          xterm -geometry 80x48+1280+0 -fa Monospace -fs 10 -e bash -lc 'tail -n +1 -F serial.log' >serial-viewer.log 2>&1 &
          serial_viewer_pid=$!
          export SDL_VIDEO_WINDOW_POS=0,0

          recording="artifacts/vexos-ci-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}.mp4"
          ffmpeg -hide_banner -loglevel info -y \
            -f x11grab -framerate 30 -video_size 1920x800 -i "$DISPLAY+0,0" \
            -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -movflags +faststart "$recording" >recording.log 2>&1 &
          ffmpeg_pid=$!
          sleep 1
          if ! kill -0 "$ffmpeg_pid" 2>/dev/null; then
            echo "Recording FAILED TO START: ffmpeg exited before QEMU launch." | tee artifacts/test-result.txt
            cat recording.log || true
            exit 1
          fi
          echo "Recording started: $recording"

          qemu_pid=""
          finish_test_capture() {
            test_status=$?
            trap - EXIT
            set +e
            if [ -n "$qemu_pid" ] && kill -0 "$qemu_pid" 2>/dev/null; then kill "$qemu_pid" 2>/dev/null; fi
            if [ -n "$qemu_pid" ]; then wait "$qemu_pid" 2>/dev/null; fi
            if [ -n "$ffmpeg_pid" ] && kill -0 "$ffmpeg_pid" 2>/dev/null; then
              kill -INT "$ffmpeg_pid" 2>/dev/null
              wait "$ffmpeg_pid"
              ffmpeg_status=$?
            else
              ffmpeg_status=1
            fi
            kill "$serial_viewer_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null
            wait "$xvfb_pid" 2>/dev/null
            if [ "$test_status" -eq 0 ]; then
              printf 'Test result: PASS\\n' > artifacts/test-result.txt
            else
              printf 'Test result: FAIL (exit %s)\\n' "$test_status" > artifacts/test-result.txt
            fi
            # The ffmpeg process may return a non-zero status after SIGINT even
            # when it has correctly written a playable MP4. Treat ffprobe's
            # validation of the actual file as authoritative; retain the exit
            # status as diagnostic information instead of rejecting good video.
            recording_valid=0
            if [ -s "$recording" ] && \
              ffprobe -v error -select_streams v:0 \
                -show_entries stream=codec_name,width,height \
                -of default=noprint_wrappers=1 "$recording" >recording-verify.log 2>&1 && \
              grep -Eq '^codec_name=.+$' recording-verify.log && \
              grep -Eq '^width=[1-9][0-9]*$' recording-verify.log && \
              grep -Eq '^height=[1-9][0-9]*$' recording-verify.log; then
              recording_valid=1
            fi

            if [ "$recording_valid" -eq 1 ]; then
              printf 'Recording status: FINALIZED AND VERIFIED\n' >> artifacts/test-result.txt
              printf 'Recording file: %s\n' "$recording" >> artifacts/test-result.txt
              if [ "$ffmpeg_status" -ne 0 ]; then
                printf 'Recording note: ffmpeg exited with status %s after shutdown, but ffprobe verified the playable MP4.\n' "$ffmpeg_status" >> artifacts/test-result.txt
              fi
              cat recording-verify.log >> artifacts/test-result.txt
            else
              printf 'Recording status: FAILED VALIDATION\n' >> artifacts/test-result.txt
              printf 'ERROR: MP4 is missing, empty, or ffprobe could not verify a video stream. ffmpeg exit status: %s\n' "$ffmpeg_status" | tee -a artifacts/test-result.txt
              cat recording-verify.log || true
              test_status=1
            fi
            cat artifacts/test-result.txt
            exit "$test_status"
          }
          trap finish_test_capture EXIT

          qemu-system-x86_64 \
            -machine pc \
            -vga std \
            -m 512M \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,unit=1,file=/tmp/OVMF_VARS.fd \
            -drive if=ide,index=0,format=raw,file=dist/tiny64.img \
            -drive if=ide,index=1,format=raw,file=dist/storage.img \
            -device ich9-ahci,id=ahci \
            -drive if=none,id=ahci_disk,format=raw,file=dist/ahci-test.img,cache=none \
            -device ide-hd,drive=ahci_disk,bus=ahci.0 \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -device usb-tablet,bus=xhci.0 \
            -display sdl \
            -monitor none \
            -serial file:serial.log \
            -qmp unix:/tmp/vexos-qmp.sock,server=on,wait=off \
            -d int,cpu_reset -D qemu-debug.log \
            -no-reboot -no-shutdown >qemu.log 2>&1 &
          qemu_pid=$!

          echo "Waiting for VexOS desktop and main loop..."
          for i in $(seq 1 200); do
            if grep -Fq "[CI] IRQ0 preempted and executed both runtime tasks" serial.log 2>/dev/null &&
               grep -Fq "[CI] Concurrent ring-3 workers, private mmap state, memory isolation, and exit/reap passed" serial.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before reaching the desktop."
              cat qemu.log || true
              cat serial.log || true
              exit 1
            fi
            sleep 0.1
          done

          for marker in \
            "[KERNEL] Entered kernel_main" \
            "[KERNEL] Heap Initialized Successfully." \
            "[CI] Heap allocator alignment/free/coalesce passed" \
            "[CI] PMM alignment/misaligned-free/double-free/reuse passed" \
            "[CI] VMM user ranges/write permissions/alignment/unmapping passed" \
            "[CI] Independent address spaces, CR3 switching, user-memory isolation, and kernel supervisor mappings passed" \
            "[CI] ELF header/segment validation and rollback passed" \
            "[CI] Task IRET frame and scheduler checks passed" \
            "[CI] Runtime task IRET frames validated" \
            "[CI] Process manager creation, scheduler CR3/TSS switching, and reaping passed" \
            "[CI] Successful framebuffer syscall draw passed" \
            "[CI] Doom test surface cleanup passed" \
            "[CI] VFS root mount/path/stat/read/write/ranged-read passed" \
            "[CI] VFS hierarchical paths and directory iteration passed" \
            "[CI] VFS directory buffer retry passed" \
            "[CI] VFS create/unlink and open-node reference rules passed" \
            "[CI] VFS independent open-file handles and descriptor offsets passed" \
            "[CI] SimpleFS multi-sector/empty-file persistence and syscall file I/O passed" \
            "[PCI] Enumeration Complete" \
            "[AHCI] SATA disk ready; sectors=" \
            "[PCI] AHCI storage initialized" \
            "[CI] AHCI SATA identify, two-sector DMA write/read, and bounds checks passed" \
            "[xHCI] Controller Running" \
            "[CI] Setup wizard skipped for automated desktop test" \
            "[KERNEL] Desktop initialized" \
            "[KERNEL] QEMU stdvga detected; mapping two framebuffer pages" \
            "[DISPLAY] QEMU VBE double-buffered page flipping enabled" \
            "[CI] RING3_WORKER_0_PASS" \
            "[CI] RING3_WORKER_1_PASS" \
            "[CI] RING3_WORKER_2_PASS" \
            "[CI] RING3_WORKER_3_PASS" \
            "[CI] Concurrent ring-3 workers, private mmap state, memory isolation, and exit/reap passed" \
            "[CI] IRQ0 preempted and executed both runtime tasks"; do
            if ! grep -Fq "$marker" serial.log; then
              echo "Expected boot marker missing: $marker"
              cat serial.log || true
              cat qemu.log || true
              tail -c 12000 qemu-debug.log || true
              exit 1
            fi
          done

          echo "Injecting a key through QEMU's emulated USB keyboard..."
          python3 - <<'PY'
          import json
          import socket
          import time

          path = "/tmp/vexos-qmp.sock"
          deadline = time.time() + 15
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          while True:
              try:
                  sock.connect(path)
                  break
              except (FileNotFoundError, ConnectionRefusedError):
                  if time.time() >= deadline:
                      raise
                  time.sleep(0.1)

          stream = sock.makefile("r", encoding="utf-8")
          greeting = json.loads(stream.readline())
          if "QMP" not in greeting:
              raise RuntimeError(f"Unexpected QMP greeting: {greeting}")

          def command(payload):
              sock.sendall((json.dumps(payload) + "\r\n").encode())
              while True:
                  response = json.loads(stream.readline())
                  if "return" in response:
                      return response["return"]
                  if "error" in response:
                      print("QMP command failed:", response["error"])
                      try:
                          print("=== serial.log ===")
                          print(open("serial.log", encoding="utf-8", errors="replace").read())
                          print("=== qemu.log ===")
                          print(open("qemu.log", encoding="utf-8", errors="replace").read())
                          print("=== qemu-debug.log tail ===")
                          print(open("qemu-debug.log", encoding="utf-8", errors="replace").read()[-12000:])
                      except OSError as exc:
                          print("Could not read debug output:", exc)
                      raise RuntimeError(response["error"])

          command({"execute": "qmp_capabilities"})
          command({"execute": "screendump", "arguments": {"filename": "artifacts/01-desktop.png"}})
          command({
              "execute": "send-key",
              "arguments": {
                  "keys": [{"type": "qcode", "data": "a"}],
                  "hold-time": 100
              }
          })
          # Move the absolute USB tablet pointer onto the taskbar Start button.
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "abs", "data": {"axis": "x", "value": 1200}},
                  {"type": "abs", "data": {"axis": "y", "value": 32000}}
              ]}
          })
          time.sleep(0.2)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": True}}
              ]}
          })
          time.sleep(0.1)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": False}}
              ]}
          })
          # Capture the opened Start menu before selecting Shell.
          command({"execute": "screendump", "arguments": {"filename": "artifacts/02-start-menu.png"}})
          # Select the first Start-menu item (Shell).
          time.sleep(0.2)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "abs", "data": {"axis": "x", "value": 1200}},
                  {"type": "abs", "data": {"axis": "y", "value": 25000}}
              ]}
          })
          time.sleep(0.1)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": True}}
              ]}
          })
          time.sleep(0.1)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": False}}
              ]}
          })
          # Capture Shell before exercising its commands.
          command({"execute": "screendump", "arguments": {"filename": "artifacts/03-shell.png"}})
          # Exercise shell commands, then open Notepad and type into it.
          sequences = [
              ["h", "e", "l", "p", "ret"],
              ["m", "e", "m", "ret"],
              ["s", "p", "e", "c", "s", "ret"],
              ["r", "i", "n", "g", "3", "ret"],
              ["d", "o", "o", "m", "ret"],
              ["n", "o", "t", "e", "p", "a", "d", "ret"],
              ["v", "e", "x"],
          ]
          for sequence in sequences:
              baseline_serial = ""
              if sequence == ["d", "o", "o", "m", "ret"]:
                  try:
                      with open("serial.log", encoding="utf-8", errors="replace") as log:
                          baseline_serial = log.read()
                  except OSError:
                      baseline_serial = ""
              for key in sequence:
                  command({
                      "execute": "send-key",
                      "arguments": {
                          "keys": [{"type": "qcode", "data": key}],
                          "hold-time": 100
                      }
                  })
                  time.sleep(0.25)
              # Ring-3 temporarily owns the display; wait for its exit syscall
              # to return control to the desktop before the next shell command.
              if sequence == ["r", "i", "n", "g", "3", "ret"]:
                  time.sleep(1.5)
              if sequence == ["d", "o", "o", "m", "ret"]:
                  # Verify the real Doom process, not the synthetic CI framebuffer pixel.
                  required = (
                      "[DOOMWIN] Ring 3 Doom window opened and focused",
                      "[WADDBG] LOCAL_OPEN",
                      "[DOOMWIN] First frame rendered by Ring 3 Doom",
                      "[CI] RING3 VFS mutation/stat/directory syscalls passed",
                  )
                  deadline = time.time() + 30
                  serial = ""
                  serial_delta = ""
                  while time.time() < deadline:
                      try:
                          with open("serial.log", encoding="utf-8", errors="replace") as log:
                              serial = log.read()
                      except OSError:
                          serial = ""
                      serial_delta = (
                          serial[len(baseline_serial):]
                          if serial.startswith(baseline_serial) else serial
                      )
                      if all(marker in serial_delta for marker in required):
                          break
                      time.sleep(0.1)
                  else:
                      raise RuntimeError(
                          "Real Doom did not open Freedoom and submit a fresh frame.\\n"
                          + serial_delta[-12000:]
                      )
                  time.sleep(2.0)

                  # Regression test: hold each arrow key long enough to exercise
                  # sustained movement, then verify the USB driver and Doom
                  # Doom backend receives both transitions and its live-state syscall agrees.
                  for qcode, label in (
                      ("right", "RIGHT"),
                      ("left", "LEFT"),
                      ("down", "DOWN"),
                      ("up", "UP"),
                  ):
                      # Send explicit key-down and key-up events around a timed hold.
                      # This guarantees the guest sees a continuous 2.5-second press.
                      command({
                          "execute": "input-send-event",
                          "arguments": {"events": [
                              {"type": "key", "data": {
                                  "down": True,
                                  "key": {"type": "qcode", "data": qcode}
                              }}
                          ]}
                      })
                      hold_started = time.monotonic()
                      time.sleep(2.5)
                      held_seconds = time.monotonic() - hold_started
                      if held_seconds < 2.5:
                          raise RuntimeError(f"{label} was held only {held_seconds:.3f}s")
                      command({
                          "execute": "input-send-event",
                          "arguments": {"events": [
                              {"type": "key", "data": {
                                  "down": False,
                                  "key": {"type": "qcode", "data": qcode}
                              }}
                          ]}
                      })
                      expected = (
                          f"[CI] USB arrow {label} down",
                          f"[CI] USB arrow {label} released",
                          f"[CI] Doom backend received {label} down",
                          f"[CI] Doom backend received {label} released",
                          f"[CI] Doom syscall arrow {label} state down",
                          f"[CI] Doom syscall arrow {label} state released",
                      )
                      deadline = time.time() + 4
                      serial = ""
                      while time.time() < deadline:
                          try:
                              with open("serial.log", encoding="utf-8", errors="replace") as log:
                                  serial = log.read()
                          except OSError:
                              serial = ""
                          if all(marker in serial for marker in expected):
                              break
                          time.sleep(0.05)
                      else:
                          raise RuntimeError(
                              f"Held {label} arrow press/release did not reach both input layers.\\n"
                              + serial[-10000:]
                          )
                      time.sleep(0.15)

                  command({"execute": "screendump", "arguments": {"filename": "artifacts/04-doom.png"}})
                  # Close Doom through its window control so desktop tests can continue.
                  # QEMU's absolute tablet axes are 0..32767 (not 0..65535).
                  close_baseline = ""
                  try:
                      with open("serial.log", encoding="utf-8", errors="replace") as log:
                          close_baseline = log.read()
                  except OSError:
                      pass
                  # Move each absolute axis separately and give the USB tablet
                  # time to publish a fresh HID report before pressing the button.
                  command({"execute": "input-send-event", "arguments": {"events": [
                      {"type": "abs", "data": {"axis": "x", "value": 32400}}
                  ]}})
                  time.sleep(0.25)
                  command({"execute": "input-send-event", "arguments": {"events": [
                      {"type": "abs", "data": {"axis": "y", "value": 600}}
                  ]}})
                  pointer_deadline = time.time() + 3
                  while time.time() < pointer_deadline:
                      try:
                          with open("serial.log", encoding="utf-8", errors="replace") as log:
                              if "[CI] USB tablet pointer reached Doom close-button area" in log.read():
                                  break
                      except OSError:
                          pass
                      time.sleep(0.05)
                  else:
                      raise RuntimeError(
                          "USB tablet never moved to the Doom close-button area.\\n"
                          + open("serial.log", encoding="utf-8", errors="replace").read()[-6000:]
                      )
                  time.sleep(0.2)
                  # Keep the press active until the desktop consumes it. A short
                  # pulse can be missed while the Ring-3 Doom task is busy.
                  command({"execute": "input-send-event", "arguments": {"events": [
                      {"type": "btn", "data": {"button": "left", "down": True}}
                  ]}})
                  click_deadline = time.time() + 6
                  close_serial = ""
                  close_delta = ""
                  close_hit = False
                  while time.time() < click_deadline:
                      try:
                          with open("serial.log", encoding="utf-8", errors="replace") as log:
                              close_serial = log.read()
                      except OSError:
                          close_serial = ""
                      close_delta = (
                          close_serial[len(close_baseline):]
                          if close_serial.startswith(close_baseline) else close_serial
                      )
                      if "[DOOMWIN] Close button hit" in close_delta:
                          close_hit = True
                          break
                      time.sleep(0.05)
                  command({"execute": "input-send-event", "arguments": {"events": [
                      {"type": "btn", "data": {"button": "left", "down": False}}
                  ]}})
                  command({"execute": "screendump", "arguments": {"filename": "artifacts/05-close-attempt.png"}})
                  if not close_hit:
                      raise RuntimeError(
                          "Doom close press was not consumed by the close handler.\\n"
                          + close_delta[-6000:]
                      )
                  exit_deadline = time.time() + 8
                  while time.time() < exit_deadline:
                      try:
                          with open("serial.log", encoding="utf-8", errors="replace") as log:
                              close_serial = log.read()
                      except OSError:
                          close_serial = ""
                      close_delta = (
                          close_serial[len(close_baseline):]
                          if close_serial.startswith(close_baseline) else close_serial
                      )
                      if "[USERMODE] exiting ring3" in close_delta:
                          break
                      time.sleep(0.05)
                  else:
                      raise RuntimeError(
                          "Doom close handler ran, but Ring 3 did not exit.\\n"
                          + close_delta[-6000:]
                      )
                  time.sleep(0.5)
          # Let the desktop process the final key and redraw Notepad before capture.
          time.sleep(0.5)
          command({"execute": "screendump", "arguments": {"filename": "artifacts/05-notepad.png"}})

          # Open Files from the centered taskbar dock and capture the redesigned file manager.
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "abs", "data": {"axis": "x", "value": 14500}},
                  {"type": "abs", "data": {"axis": "y", "value": 31600}}
              ]}
          })
          time.sleep(0.1)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": True}}
              ]}
          })
          time.sleep(0.1)
          command({
              "execute": "input-send-event",
              "arguments": {"events": [
                  {"type": "btn", "data": {"button": "left", "down": False}}
              ]}
          })
          time.sleep(0.5)
          command({"execute": "screendump", "arguments": {"filename": "artifacts/06-files.png"}})
          stream.close()
          sock.close()
          print("QMP injected keyboard input, USB tablet movement, three mouse clicks, and captured five PNG screenshots.")
          PY

          echo "Waiting for keyboard, mouse movement, Start menu, and shell input..."
          markers=(
            "[CI] Keyboard character reached desktop input queue"
            "[CI] IRQ0 preempted and executed both runtime tasks"
            "[CI] Mouse pointer movement reached desktop_tick"
            "[CI] Start menu opened by USB mouse click"
            "[CI] Shell opened from Start menu mouse click"
            "[CI] Shell received printable keyboard input"
            "[CI] Shell command submitted through keyboard"
            "[CI] Shell help command executed"
            "[CI] Shell mem command executed"
            "[CI] Shell specs command executed"
            "[CI] Ring3 int80 syscall and exit passed"
            "[USERMODE] exiting ring3"
            "[CI] Notepad opened by shell command"
            "[CI] Notepad accepted the full typed text vex"
            "[CI] Files opened from taskbar dock click"
          )
          for i in $(seq 1 150); do
            all_seen=1
            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" serial.log; then
                all_seen=0
                break
              fi
            done
            if [ "$all_seen" -eq 1 ]; then
              break
            fi
            sleep 0.1
          done

          for marker in "${markers[@]}"; do
            if ! grep -Fq "$marker" serial.log; then
              echo "Expected input/desktop marker missing: $marker"
              cat serial.log || true
              cat qemu.log || true
              tail -c 12000 qemu-debug.log || true
              exit 1
            fi
          done

          if grep -Fq "[KERNEL] FATAL:" serial.log; then
            echo "Kernel reported a fatal error:"
            cat serial.log
            exit 1
          fi

          echo "PASS: UEFI boot, desktop initialization, USB keyboard, USB tablet movement, Start menu click, Shell launch, typed command, and Files dock launch."
          printf 'Test result: PASS - boot, desktop input, Shell, Notepad, and Files interactions observed\\n' > artifacts/test-result.txt
          tail -c 5000 serial.log

      - name: Symbolize kernel fault on QEMU failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ -s dist/kernel.elf ]]; then
            cp dist/kernel.elf artifacts/kernel.elf
            nm -n dist/kernel.elf > artifacts/kernel-symbols.txt
            fault_rip="$(grep -Eo 'rip=[[:xdigit:]]+' serial.log 2>/dev/null | tail -n 1 | cut -d= -f2 || true)"
            if [[ -n "$fault_rip" ]]; then
              {
                echo "Kernel fault RIP: 0x$fault_rip"
                addr2line -e dist/kernel.elf -f -C "0x$fault_rip" || true
              } | tee artifacts/kernel-fault-symbol.txt
              address="$(printf '%d' "0x$fault_rip")"
              start=$((address > 96 ? address - 96 : 0))
              end=$((address + 128))
              objdump -d -Mintel --start-address="$start" --stop-address="$end" dist/kernel.elf \
                > artifacts/kernel-fault-disassembly.txt || true
            fi
          fi

      - name: Upload complete QEMU test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexos-ci-run-${{ github.run_number }}-${{ github.run_id }}
          path: |
            artifacts/
            serial.log
            qemu.log
            qemu-debug.log
            xvfb.log
            recording.log
            recording-verify.log
          if-no-files-found: warn
          retention-days: 14
